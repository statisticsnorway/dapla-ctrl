
syntax = "proto3";

package dapla.api.protobuf;

import "pagination.proto";

option go_package = "./pkg/apiclient/protoapi";

message ArtifactRegistryRepo {
  string team_slug = 1;
  string format = 2;
  int64 size_bytes = 3;
}

service ArtifactRegistry {
  rpc GetArtifactRegistryRepo(GetArtifactRegistryRepoRequest) returns (GetArtifactRegistryRepoResponse) {}
  rpc ListArtifactRegistryReposForTeam(ListArtifactRegistryReposForTeamRequest) returns (ListArtifactRegistryReposForTeamResponse) {}
  rpc SetArtifactRegistryRepoSizeBytes(SetArtifactRegistryRepoSizeBytesRequest) returns (SetArtifactRegistryRepoSizeBytesResponse) {}
  rpc GetArtifactRegistryGithubAllowlist(GetArtifactRegistryGithubAllowlistRequest) returns (GetArtifactRegistryGithubAllowlistResponse) {}
}

message GetArtifactRegistryRepoResponse {
  ArtifactRegistryRepo repo = 1;
}

message GetArtifactRegistryRepoRequest {
  string team_slug = 1;
  string format = 2;
}

message ListArtifactRegistryReposForTeamRequest {
  string team_slug = 1;
  int64 limit = 2;
  int64 offset = 3;
}

message ListArtifactRegistryReposForTeamResponse {
  string team = 1;
  repeated ArtifactRegistryRepo nodes = 2;
  PageInfo page_info = 3;
}


message SetArtifactRegistryRepoSizeBytesResponse {}
message SetArtifactRegistryRepoSizeBytesRequest {
    string team_slug = 1;
    string format = 2;
    int64 size_bytes = 3;
}

message GetArtifactRegistryGithubAllowlistRequest {
    string team_slug = 1;
    int64 limit = 2;
    int64 offset = 3;
}

message GetArtifactRegistryGithubAllowlistResponse {
    repeated string nodes = 1;
    PageInfo page_info = 2;
}

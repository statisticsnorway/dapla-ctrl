syntax = "proto3";

package dapla.api.protobuf;

import "users.proto";
import "google/protobuf/timestamp.proto";
import "groups.proto";
import "pagination.proto";

option go_package = "./pkg/apiclient/protoapi";

message Team {
  string slug = 1;
  bool has_parquedit = 2;
  optional google.protobuf.Timestamp delete_key_confirmed_at = 3;
  bool is_managed = 4;
}

message Feature {
  string name = 1;
  string env = 2;
}

service Teams {
  rpc Get(GetTeamRequest) returns (GetTeamResponse) {}
  rpc List(ListTeamsRequest) returns (ListTeamsResponse) {}
  rpc Groups(ListTeamGroupsRequest) returns (ListTeamGroupsResponse) {}
  rpc Delete(DeleteTeamRequest) returns (DeleteTeamResponse) {}
  rpc HasFeature(HasFeatureRequest) returns (HasFeatureResponse) {}
  rpc GetOwner(GetOwnerRequest) returns (GetOwnerResponse) {}
}

message GetOwnerRequest { string slug = 1; }
message GetOwnerResponse { User user = 1; }

message DeleteTeamRequest { string slug = 1; }

message DeleteTeamResponse {}

message GetTeamResponse { Team team = 1; }

message GetTeamRequest { string slug = 1; }

message ListTeamsRequest {
  int64 limit = 1;
  int64 offset = 2;
}

message ListTeamsResponse {
  repeated Team nodes = 1;
  PageInfo page_info = 2;
}

message ListTeamGroupsRequest {
  int64 limit = 1;
  int64 offset = 2;
  string slug = 3;
}

message ListTeamGroupsResponse {
  repeated TeamGroup nodes = 1;
  PageInfo page_info = 2;
}

message HasFeatureRequest {
  string slug = 1;
  Feature feature = 2;
}

message HasFeatureResponse { bool has_feature = 1; }

message TeamGroup { Group group = 1; }

syntax = "proto3";

package dapla.api.protobuf;

import "pagination.proto";

option go_package = "./pkg/apiclient/protoapi";

message ArtifactRegistryRepo {
  string team_slug = 1;
  string format = 2;
}

service ArtifactRegistry {
  rpc GetArtifactRegistryRepo(GetArtifactRegistryRepoRequest) returns (GetArtifactRegistryRepoResponse) {}
  rpc ListArtifactRegistryReposForTeam(ListArtifactRegistryReposForTeamRequest) returns (ListArtifactRegistryReposForTeamResponse) {}
}

message GetArtifactRegistryRepoResponse {
  ArtifactRegistryRepo repo = 1;
}

message GetArtifactRegistryRepoRequest {
  string team_slug = 1;
  string format = 2;
}

message ListArtifactRegistryReposForTeamRequest {
  string team_slug = 1;
  int64 limit = 2;
  int64 offset = 3;
}

message ListArtifactRegistryReposForTeamResponse {
  string team = 1;
  repeated ArtifactRegistryRepo nodes = 2;
  PageInfo page_info = 3;
}
